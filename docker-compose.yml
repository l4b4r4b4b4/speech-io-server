volumes:
  model_cache:

services:
  speech-io-server:
    image: ghcr.io/l4b4r4b4b4/speech-io-server:latest
    ports:
      - 8003:8003
    volumes:
      - model_cache:/app/model_cache
      - ./assets/reference_audio:/app/reference_audio
      - ./assets/outputs:/app/outputs:rw
      - ./assets/voices:/app/voices
      - ./assets/config.yaml:/app/config.yaml
    devices:
      - nvidia.com/gpu=all
    device_cgroup_rules:
      - "c 195:* rmw"
      - "c 236:* rmw"
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HUB_ENABLE_HF_TRANSFER=1
